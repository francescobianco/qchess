[package]
name = "qchess"
version = "0.1.0"
edition = "2021"
description = "A TUI chess database browser — any folder with PGN files is a valid database"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
shakmaty = "0.27"
pgn-reader = "0.27"
walkdir = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "qchess"
path = "src/main.rs"
